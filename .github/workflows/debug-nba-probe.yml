name: Debug NBA Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Connect NordVPN (probe disabled)
        id: vpn
        uses: ./.github/actions/nordvpn-connect
        with:
          openvpn-user: ${{ secrets.OPENVPN_USER }}
          openvpn-password: ${{ secrets.OPENVPN_PASSWORD }}
          nordvpn-token: ${{ secrets.NORDVPN_TOKEN }}
          nba-stack-probe-enabled: "false"

      - name: Diagnose CommonAllPlayers contract
        run: uv run python .github/scripts/debug_common_all_players.py

      - name: Disconnect NordVPN
        if: always()
        run: sudo pkill -x openvpn || true
